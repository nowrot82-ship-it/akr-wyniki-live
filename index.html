<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b0b0b"><title>AKR | WYNIKI LIVE</title>
<style>
:root{color-scheme:dark;--bg:#090909;--panel:#171717;--red:#d71920;--white:#fff;--line:#393939}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:15px/1.5 Arial,Helvetica,sans-serif}.wrap{max-width:1150px;margin:auto;padding:18px}.mast{text-align:center;padding:22px 0 20px;border-bottom:3px solid var(--red)}.logo{display:inline-block;background:var(--red);color:#fff;padding:5px 30px;border-radius:10px;font-size:52px;line-height:1.2;font-weight:900;letter-spacing:4px}.mast h1{margin:10px 0 0;font-size:30px;letter-spacing:2px}.mast small{font-size:11px;letter-spacing:2px}.status{margin-top:10px;font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:5px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin:18px 0}.label{font-size:12px;font-weight:800;letter-spacing:1px;margin:0 0 9px}.osrow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}.osrow button,.mode button{padding:12px 3px;background:#262626;border:1px solid #444;color:white;border-radius:8px;font-size:14px;font-weight:800;cursor:pointer}.osrow button.active,.mode button.active{background:var(--red);border-color:var(--red)}select,input{width:100%;background:#252525;color:white;border:1px solid #555;border-radius:8px;padding:13px;font-size:15px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.toolbar h2{margin:0;font-size:20px}.note{color:#ccc;font-size:12px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:620px}th{text-align:left;color:#fff;background:#282828;font-size:12px;letter-spacing:.6px}td,th{padding:12px 10px;border-bottom:1px solid #393939}td.time{font-size:18px;font-weight:900;white-space:nowrap}td.pos{font-weight:900;color:#fff;width:55px}td.nr{font-weight:900;color:#fff;width:65px}.sub{font-size:12px;color:#ccc}.gap{font-size:12px;color:#ccc}tr:hover td{background:#222}.empty{text-align:center;padding:35px;color:#ccc}.error{border-left:4px solid var(--red);padding:12px;background:#271010;margin:14px 0}.footer{text-align:center;font-size:12px;color:#bbb;padding:24px}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid white;outline-offset:2px}@media(max-width:650px){.wrap{padding:10px}.logo{font-size:43px}.mast h1{font-size:24px}.panel{padding:12px}.controls{grid-template-columns:1fr}.osrow{gap:4px}.osrow button{font-size:12px;padding:12px 0}.toolbar h2{font-size:18px}}
</style></head><body><main class="wrap"><header class="mast"><div class="logo" aria-label="AKR">AKR</div><h1>WYNIKI LIVE</h1><small>OFICJALNY SYSTEM WYNIKÓW RAJDU</small><div class="status"><span class="dot"></span><span id="status">Łączenie z wynikami…</span></div></header>
<section class="panel" aria-label="Wybór wyników"><div class="label">ODCINEK SPECJALNY</div><div class="osrow" id="osrow"></div><div class="controls"><div><div class="label">KLASA</div><select id="klasa"><option value="">Wszystkie klasy</option></select></div><div><div class="label">RODZAJ WYNIKÓW</div><div class="mode"><button type="button" id="na">WYNIK NA OS</button><button type="button" id="po">WYNIK PO OS</button></div></div></div><div style="margin-top:16px"><div class="label">SZUKAJ ZAŁOGI LUB NUMERU</div><input id="szukaj" type="search" placeholder="Nr startowy, kierowca, pilot…"></div></section>
<section class="panel"><div class="toolbar"><h2 id="tytul">WYNIKI</h2><div class="note" id="meta">Oczekiwanie na dane</div></div><div id="blad" role="alert"></div><div class="tablewrap"><table><thead><tr><th>POZ.</th><th>NR</th><th>ZAŁOGA / SAMOCHÓD</th><th>KLASA</th><th>CZAS</th><th>STRATA</th></tr></thead><tbody id="tabela"><tr><td colspan="6" class="empty">Ładowanie wyników…</td></tr></tbody></table></div></section><footer class="footer">AKR • WYNIKI LIVE • Automatyczne odświeżanie co 30 sekund</footer></main>
<script>
'use strict';
const API='https://script.google.com/macros/s/AKfycbwtcbpTmcDbpIlW7YtfmmWJXyyg1Tgp9M-LS5CepIfh4vtdoHHicTK3MdOQQkjs9Jxb/exec';
let data=null,os=1,mode='po',busy=false,seq=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function secs(v){const s=String(v??'').trim().replace(/\s/g,'');if(!s)return null;const p=s.replace(',','.').split(':');if(p.length<2||p.length>3)return null;const n=p.map(Number);if(n.some(x=>!Number.isFinite(x)||x<0))return null;return p.length===2?n[0]*60+n[1]:n[0]*3600+n[1]*60+n[2]}
function fmt(n){if(n===null||!Number.isFinite(n))return '—';let cent=Math.round(n*100);const h=Math.floor(cent/360000);cent%=360000;const m=Math.floor(cent/6000);cent%=6000;const s=Math.floor(cent/100),c=cent%100;const z=x=>String(x).padStart(2,'0');return h?`${z(h)}:${z(m)}:${z(s)},${z(c)}`:`${z(m)}:${z(s)},${z(c)}`}
function parseRow(z){const w=Array.isArray(z.wyniki)?z.wyniki:[];const times=[];for(let i=0;i<6;i++){const b=i*3;times.push({raw:secs(w[b]),pen:secs(w[b+1]),total:secs(w[b+2])});}return times}
function selectedTime(z){const t=parseRow(z);if(mode==='na')return t[os-1].total;let sum=0;for(let i=0;i<os;i++){if(t[i].total===null)return null;sum+=t[i].total}return sum}
function render(){document.querySelectorAll('#osrow button').forEach((b,i)=>{b.classList.toggle('active',i+1===os);b.setAttribute('aria-pressed',String(i+1===os))});['na','po'].forEach(x=>{$(x).classList.toggle('active',mode===x);$(x).setAttribute('aria-pressed',String(mode===x))});$('tytul').textContent=(mode==='na'?'WYNIK NA ':'WYNIK PO ')+`OS${os}`;if(!data)return;const k=$('klasa').value,q=$('szukaj').value.toLocaleLowerCase('pl').trim();let a=data.zalogi.filter(z=>(!k||z.klasa===k)&&(!q||[z.nr,z.kierowca,z.pilot,z.samochod].some(v=>String(v??'').toLocaleLowerCase('pl').includes(q)))).map(z=>({...z,czas:selectedTime(z)}));a.sort((x,y)=>(x.czas===null?Infinity:x.czas)-(y.czas===null?Infinity:y.czas)||Number(x.nr)-Number(y.nr));const leader=a.find(x=>x.czas!==null)?.czas??null;let pos=0,prev=null,place=0;const html=a.map(z=>{if(z.czas!==null){pos++;if(prev===null||Math.abs(prev-z.czas)>.00001)place=pos;prev=z.czas}const rank=z.czas===null?'—':place;const diff=z.czas===null||leader===null?'—':z.czas===leader?'—':'+'+fmt(z.czas-leader);return `<tr><td class="pos">${rank}</td><td class="nr">#${esc(z.nr)}</td><td><strong>${esc(z.kierowca)} / ${esc(z.pilot)}</strong><div class="sub">${esc(z.samochod)}</div></td><td>${esc(z.klasa)}</td><td class="time">${fmt(z.czas)}</td><td class="gap">${diff}</td></tr>`}).join('');$('tabela').innerHTML=html||'<tr><td colspan="6" class="empty">Brak załóg dla wybranych filtrów</td></tr>';$('meta').textContent=`${a.length} załóg • odświeżanie 30 s`}
function setData(d){if(!d||!d.ok||!Array.isArray(d.zalogi))throw Error('API nie zwróciło prawidłowych danych');data=d;const old=$('klasa').value;const classes=[...new Set(d.zalogi.map(z=>String(z.klasa||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pl',{numeric:true}));$('klasa').innerHTML='<option value="">Wszystkie klasy</option>'+classes.map(k=>`<option value="${esc(k)}">${esc(k)}</option>`).join('');$('klasa').value=classes.includes(old)?old:'';$('status').textContent='Wyniki połączone • '+new Date().toLocaleTimeString('pl-PL');$('blad').innerHTML='';render()}
function load(){if(busy)return;busy=true;const id=++seq,cb='AKRcallback_'+id+'_'+Date.now(),s=document.createElement('script');let finished=false;const timeout=setTimeout(()=>finish(new Error('Brak odpowiedzi API')),15000);function finish(err,payload){if(finished)return;finished=true;clearTimeout(timeout);delete window[cb];s.remove();busy=false;try{if(err)throw err;setData(payload)}catch(e){$('status').textContent='Brak połączenia • ponawiam za 30 s';$('blad').innerHTML='<div class="error">Nie udało się odświeżyć wyników. '+(data?'Wyświetlane są ostatnio pobrane dane.':'Sprawdź wdrożenie API i połączenie internetowe.')+'</div>'}}window[cb]=d=>finish(null,d);s.onerror=()=>finish(new Error('Błąd pobierania'));s.src=API+'?callback='+encodeURIComponent(cb)+'&t='+Date.now();document.head.appendChild(s)}
for(let i=1;i<=6;i++){const b=document.createElement('button');b.type='button';b.textContent='OS'+i;b.onclick=()=>{os=i;render()};$('osrow').appendChild(b)}$('na').onclick=()=>{mode='na';render()};$('po').onclick=()=>{mode='po';render()};$('klasa').onchange=render;$('szukaj').oninput=render;render();load();setInterval(load,30000);
</script></body></html>
