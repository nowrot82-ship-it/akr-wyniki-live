
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Regulamin | AKR WYNIKI LIVE 2.0</title>

  <!-- Oryginalny wspolny naglowek AKR -->
  <link rel="stylesheet" href="/test-v2/akr-header.css?v=5">

  <style>
    :root {
      color-scheme: dark;
      --akr-red: #e32932;
      --akr-bg: #0b1220;
      --akr-panel: #162238;
      --akr-border: #2b3b54;
      --akr-text: #edf2fa;
      --akr-muted: #a9b7cb;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--akr-bg);
      color: var(--akr-text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.75;
    }

    /* Cienka czerwona linia pod menu */

    #akr-shared-header {
      position: relative;
      z-index: 20;
      border-bottom: 2px solid var(--akr-red);
    }

    /* Zachowanie wspolnego menu AKR */

    #akr-shared-header .akr-menu-overlay[hidden] {
      display: none !important;
    }

    /* Glowna zawartosc */

    main {
      max-width: 1050px;
      margin: 30px auto;
      padding: 0 16px 50px;
    }

    .page-heading {
      text-align: center;
      margin-bottom: 25px;
    }

    .page-heading h1 {
      margin: 0 0 6px;
      color: var(--akr-red);
      font-size: clamp(26px, 5vw, 38px);
      line-height: 1.3;
    }

    .page-heading p {
      margin: 0;
      color: var(--akr-muted);
      font-size: 14px;
    }

    /* Regulamin */

    .document {
      padding: clamp(20px, 5vw, 48px);
      background: var(--akr-panel);
      border: 1px solid var(--akr-border);
      border-radius: 18px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, .16);
    }

    .document h1,
    .document h2,
    .document h3 {
      color: var(--akr-text);
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .document h1 {
      margin: 0 0 26px;
      font-size: clamp(21px, 4vw, 29px);
      text-align: center;
      color: var(--akr-red);
    }

    .document h2 {
      margin: 34px 0 12px;
      font-size: 21px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(227, 41, 50, .35);
    }

    .document h3 {
      margin: 25px 0 10px;
      font-size: 18px;
    }

    .document p {
      margin: 0 0 15px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .document .akr-list-item {
      padding-left: 12px;
    }

    /* Tabele z Google Docs */

    .akr-table-wrap {
      width: 100%;
      overflow-x: auto;
      margin: 20px 0;
    }

    .document table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .document td {
      padding: 10px;
      border: 1px solid #42516a;
      vertical-align: top;
    }

    /* Komunikaty */

    .status {
      padding: 25px 10px;
      text-align: center;
      color: var(--akr-muted);
    }

    .status.error {
      color: #ffb6b6;
    }

    /* Powrot do strony glownej */

    .actions {
      display: flex;
      justify-content: center;
      margin-top: 28px;
    }

    .back-button {
      display: inline-block;
      width: min(100%, 380px);
      padding: 15px 24px;
      border: 1px solid #ff555c;
      border-radius: 10px;
      background: var(--akr-red);
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: .4px;
      text-align: center;
      text-decoration: none;
      transition: background .2s ease;
    }

    .back-button:hover,
    .back-button:focus-visible {
      background: #b91e27;
      color: #fff;
    }

    footer {
      padding: 20px;
      color: var(--akr-muted);
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      main {
        margin-top: 22px;
      }

      .document {
        border-radius: 12px;
      }

      .document h2 {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <!-- Ten element wypelnia wspolny skrypt AKR -->
  <div id="akr-shared-header"></div>

  <main>

    <div class="page-heading">
      <h1>REGULAMIN</h1>
      <p>Oficjalny regulamin wydarzenia</p>
    </div>

    <article class="document" aria-label="Treść regulaminu">

      <div
        id="loading-status"
        class="status"
        role="status"
      >
        Pobieranie aktualnego regulaminu…
      </div>

      <div id="regulamin-content" hidden></div>

    </article>

    <div class="actions">
      <a class="back-button" href="/">
        ← WRÓĆ DO STRONY GŁÓWNEJ
      </a>
    </div>

  </main>

  <footer>
    AKR WYNIKI LIVE 2.0
  </footer>

  <!-- Oryginalny wspolny skrypt naglowka -->
  <script src="/test-v2/akr-header.js?v=5"></script>

  <script>
    "use strict";

    // =========================================
    // POPRAWNE LINKI W MENU DLA TEJ PODSTRONY
    // =========================================

    (function fixRegulaminNavigation() {
      const header = document.getElementById(
        "akr-shared-header"
      );

      if (!header) return;

      const brand = header.querySelector(".akr-brand");

      if (brand) {
        brand.href = "/";
      }

      const menuLinks = header.querySelectorAll(
        ".akr-menu-panel nav a"
      );

      menuLinks.forEach(function (link) {
        const href = link.getAttribute("href");

        if (href === "index.html") {
          link.href = "/";
        }
      });
    })();


    // =========================================
    // API REGULAMINU Z GOOGLE DOCS
    // =========================================

    const REGULAMIN_API =
      "https://script.google.com/macros/s/AKfycbxd62C-wX3331UyU5xSfNj5IKnSb4aLs5goRVqQH5kj40jm2FTMh6nBvzVqyFt_vQkt/exec";


    // =========================================
    // POBIERANIE AKTUALNEGO REGULAMINU
    // =========================================

    function loadRegulamin() {
      const status = document.getElementById(
        "loading-status"
      );

      const content = document.getElementById(
        "regulamin-content"
      );

      const callback =
        "AKRregulamin_" +
        Date.now() +
        "_" +
        Math.random().toString(36).slice(2, 10);

      const script = document.createElement("script");

      let finished = false;

      const timer = setTimeout(function () {
        finish(
          new Error("Przekroczono czas oczekiwania")
        );
      }, 15000);


      function finish(error, data) {
        if (finished) return;

        finished = true;

        clearTimeout(timer);
        script.remove();

        try {
          delete window[callback];
        } catch (e) {
          window[callback] = undefined;
        }

        if (
          error ||
          !data ||
          data.ok !== true ||
          typeof data.tresc !== "string"
        ) {
          status.textContent =
            "Nie udało się pobrać regulaminu. " +
            "Odśwież stronę i spróbuj ponownie.";

          status.classList.add("error");
          return;
        }

        if (!data.tresc.trim()) {
          status.textContent =
            "Regulamin jest obecnie pusty.";
          return;
        }

        // HTML generuje nasz Apps Script.
        // Tekst dokumentu jest tam zabezpieczany.

        content.innerHTML = data.tresc;

        content.hidden = false;
        status.hidden = true;
      }


      window[callback] = function (data) {
        finish(null, data);
      };

      script.onerror = function () {
        finish(
          new Error("Nie udało się załadować API")
        );
      };

      const url = new URL(REGULAMIN_API);

      url.searchParams.set("callback", callback);
      url.searchParams.set("t", Date.now());

      script.src = url.href;

      document.head.appendChild(script);
    }


    // =========================================
    // START
    // =========================================

    loadRegulamin();

  </script>

</body>
</html>
